name: tests

on:
  push:
    branches: [{{DEFAULT_BRANCH}}]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    # The job name is the required status check in the "Protect main" ruleset.
    # Rename both together, or PRs wait forever for a check that never reports.
    name: validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: validate the manifest
        run: claude plugin validate .

      # `claude plugin test` runs a hooks module's tests. A plugin without one
      # (skills, commands, bash hooks only) has nothing for it to run.
      - name: run the plugin tests
        run: |
          if out=$(claude plugin test . 2>&1); then echo "$out"
          elif grep -q 'no hooks module to load' <<<"$out"; then echo "no hooks module: nothing for claude plugin test to run"
          else echo "$out"; exit 1; fi

      - name: check the shell scripts
        run: |
          files=$(git ls-files '*.sh')
          [ -n "$files" ] || { echo "no shell scripts"; exit 0; }
          printf '%s\n' "$files" | xargs -n1 bash -n
          printf '%s\n' "$files" | xargs shellcheck --severity=error
